name: terraform plan

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - main
    paths:
      - "terrafrom/**"
      - ".github/workflows/teraform-plan.yaml"
      - ".github/workflows/terraform-action.yaml"

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  aws-plan:
    strategy:
      matrix:
        terraform_environment: [kubernetes-the-hard-way-aws]
    uses:  KevinGao99/kubernetes-projects-Kev/.github/workflows/terraform-action.yaml@main
    with:
      deploy: false
      terraform_environment: ${{ matrix.terraform_environment }}
      pr_number: ${{ github.event.number }}
    secrets:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
