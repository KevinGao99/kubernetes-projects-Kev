name: terraform plan

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/teraform-plan.yaml"
      - ".github/workflows/terraform-action.yaml"
  issue_comment:
    types:
      - created

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  aws-plan:
    if: |
      github.event_name == 'pull_request' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        contains(github.event.comment.body, 'terraform plan')
      )
    strategy:
      matrix:
        terraform_environment: [kubernetes-the-hard-way-aws]
    uses:  KevinGao99/kubernetes-projects-Kev/.github/workflows/terraform-action.yaml@main
    with:
      deploy: false
      terraform_environment: ${{ matrix.terraform_environment }}
      pr_number: pr_number: ${{ github.event_name == 'pull_request' && github.event.number || github.event.issue.number }}
      checkout_ref: ${{ github.event_name == 'issue_comment' && format('refs/pull/{0}/merge', github.event.issue.number) || github.ref }}
    secrets:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
